# Mock IT asset categories — EDIT THIS FILE to change the categories the agent may assign.
# The agent is constrained to the `name` values below. `description` guides classification.
categories:
  - name: "Laptops & Notebooks"
    description: "Portable computers: laptops, notebooks, ultrabooks, MacBooks, 2-in-1 convertibles."
  - name: "Desktops & Workstations"
    description: "Fixed computers: desktop towers, all-in-ones, mini PCs, engineering workstations."
  - name: "Monitors & Displays"
    description: "External monitors, displays, projectors, digital signage screens."
  - name: "Peripherals & Accessories"
    description: "Keyboards, mice, webcams, headsets, docking stations, USB hubs, styluses."
  - name: "Networking Equipment"
    description: "Routers, switches, access points, firewalls, modems, network cards."
  - name: "Servers & Storage"
    description: "Rack/tower servers, NAS/SAN, external drives, backup appliances."
  - name: "Mobile Devices"
    description: "Smartphones, tablets, e-readers and their carrier/SIM accessories."
  - name: "Printers & Scanners"
    description: "Printers, multifunction devices, scanners, plotters, label printers."
  - name: "Software Licenses & Subscriptions"
    description: "Software licenses, SaaS subscriptions, OS licenses, antivirus, cloud credits."
  - name: "Cables & Adapters"
    description: "HDMI/USB/Ethernet cables, power adapters, dongles, converters."
  - name: "Power & UPS"
    description: "Uninterruptible power supplies, surge protectors, power strips, batteries."
  - name: "Components & Parts"
    description: "Internal parts: RAM, SSDs/HDDs, GPUs, CPUs, motherboards, cooling."
  - name: "Uncategorized"
    description: "Use only when no other category reasonably applies."
