[project]
name = "asset-pipeline"
version = "0.1.0"
description = "3-stage asset management extraction pipeline (receipt -> categorize -> JSON)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "deepagents>=0.0.1",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pdf2image>=1.17",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "redis>=8.1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "python-multipart>=0.0.32",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
# Optional local-embeddings path (pgvector shortlist). Pulls torch, so it is not
# installed by default / in the container. Enable with: uv sync --extra embeddings
embeddings = [
    "sentence-transformers>=3.0",
]

[tool.uv]
package = false
